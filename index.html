<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIC CLASH: Binary Board</title>
<style>
  :root{
    --bg-0:#0c0e1a;
    --bg-1:#12172b;
    --panel:#161c33;
    --line:#2a3358;
    --ink:#e9ecf7;
    --ink-dim:#8891b5;
    --amber:#ffb833;
    --cyan:#3ee6e0;
    --magenta:#ff6bd6;
    --true-c:#3ee6a0;
    --false-c:#ff5d7a;
    --font-display: 'Rajdhani', 'Arial Narrow', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, #1c2242 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #1a2340 0%, transparent 50%),
      var(--bg-0);
    color:var(--ink);
    font-family:var(--font-display), system-ui, sans-serif;
    padding:24px;
  }
  .wrap{ width:100%; max-width:920px; margin:0 auto; }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .logo-plate{
    display:flex; align-items:center; gap:14px;
    background:#ffffff; border-radius:14px;
    padding:8px 16px;
    box-shadow:0 8px 30px -10px rgba(0,0,0,.6);
    max-width:100%;
  }
  .logo-plate img{ display:block; width:auto; }
  .logo-a{ height:60px; }
  .logo-b{ height:38px; }
  .logo-div{ width:1px; align-self:stretch; background:#d9dce6; }
  @media (max-width:640px){
    .logo-plate{ padding:6px 10px; gap:10px; }
    .logo-a{ height:42px; }
    .logo-b{ height:26px; }
  }
  @media (max-width:420px){
    .logo-a{ height:34px; }
    .logo-b{ height:21px; }
  }
  .brand{ display:flex; flex-direction:column; line-height:1; }
  .brand small{ font-family:var(--font-mono); letter-spacing:.18em; font-size:11px; color:var(--cyan); }
  .brand h1{ margin:4px 0 0; font-size:26px; font-weight:700; letter-spacing:.02em; }
  .brand h1 span{color:var(--amber);}
  .hud-stats{ display:flex; gap:14px; font-family:var(--font-mono); }
  .stat{ text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 14px; min-width:64px; }
  .stat .num{font-size:20px;font-weight:700;color:var(--ink);}
  .stat .lbl{font-size:9px;color:var(--ink-dim);letter-spacing:.1em;}

  .legend{
    display:flex; gap:16px; flex-wrap:wrap;
    font-family:var(--font-mono); font-size:11px; color:var(--ink-dim);
    margin-bottom:16px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:3px; display:inline-block; }
  .dot.easy{background:var(--cyan);}
  .dot.med{background:var(--amber);}
  .dot.hard{background:var(--magenta);}

  /* ---------- screens ---------- */
  .screen{display:none;}
  .screen.show{display:block;}
  .center-txt{text-align:center;}

  /* ---------- start card ---------- */
  .card{
    background:linear-gradient(180deg,var(--bg-1),var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 28px;
    position:relative;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
  }
  .lead{ font-size:15px; color:var(--ink-dim); max-width:520px; margin:0 auto 22px; line-height:1.6; }
  .rules{ text-align:left; background:var(--bg-0); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:0 auto 24px; max-width:520px; font-size:13px; color:var(--ink-dim); }
  .rules li{margin-bottom:6px;}
  .rank-badge{ font-family:var(--font-mono); font-size:13px; letter-spacing:.15em; color:var(--amber); display:inline-block; margin-bottom:6px; }
  .start-btn, .retry-btn, .finish-btn{
    font-family:var(--font-display); font-weight:700; font-size:17px;
    background:linear-gradient(90deg,var(--cyan),var(--amber));
    color:#0c0e1a; border:none; padding:14px 30px; border-radius:12px; cursor:pointer;
  }
  .start-btn:hover, .retry-btn:hover, .finish-btn:hover{filter:brightness(1.05);}
  .finish-btn{ background:var(--panel); color:var(--ink); border:1px solid var(--line); font-size:14px; padding:10px 20px; }
  .finish-btn:hover{ border-color:var(--amber); filter:none; }

  /* ---------- board grid ---------- */
  .board{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    margin-bottom:20px;
  }
  .qcard{
    aspect-ratio:1/1;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    transition:transform .12s ease, border-color .15s;
    position:relative;
    overflow:hidden;
  }
  .qcard:hover:not(.done){ transform:translateY(-3px); }
  .qcard.easy{ border-color:rgba(62,230,224,.35); }
  .qcard.easy:hover:not(.done){ border-color:var(--cyan); }
  .qcard.med{ border-color:rgba(255,184,51,.35); }
  .qcard.med:hover:not(.done){ border-color:var(--amber); }
  .qcard.hard{ border-color:rgba(255,107,214,.35); }
  .qcard.hard:hover:not(.done){ border-color:var(--magenta); }

  .qcard .idx{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); position:absolute; top:8px; left:10px; }
  .qcard .pts{ font-size:26px; font-weight:700; }
  .qcard.easy .pts{ color:var(--cyan); }
  .qcard.med .pts{ color:var(--amber); }
  .qcard.hard .pts{ color:var(--magenta); }
  .qcard .diff{ font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; color:var(--ink-dim); }

  .qcard.done{ cursor:default; }
  .qcard.done.correct{ background:rgba(62,230,160,.10); border-color:var(--true-c); }
  .qcard.done.wrong{ background:rgba(255,93,122,.10); border-color:var(--false-c); }
  .qcard.done .pts, .qcard.done .diff{ opacity:.35; }
  .qcard .mark{ display:none; font-size:22px; }
  .qcard.done .mark{ display:block; }
  .qcard.done .pts, .qcard.done .idx, .qcard.done .diff{ display:none; }
  .qcard.done.correct .mark{ color:var(--true-c); }
  .qcard.done.wrong .mark{ color:var(--false-c); }

  .board-footer{ display:flex; justify-content:center; }

  /* ---------- question screen ---------- */
  .qmeta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .qtag{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); letter-spacing:.08em; }
  .qtag b{ color:var(--amber); }
  .timer-ring{ position:relative; width:46px;height:46px; }
  .timer-ring svg{transform:rotate(-90deg);}
  .timer-ring circle{ fill:none; stroke-width:4; }
  .timer-ring .bg{stroke:var(--line);}
  .timer-ring .fg{stroke:var(--amber); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s;}
  .timer-ring .txt{ position:absolute;inset:0; display:flex;align-items:center;justify-content:center; font-family:var(--font-mono); font-size:14px;font-weight:700; }

  .assign{ font-family:var(--font-mono); font-size:13px; color:var(--cyan); background:rgba(62,230,224,.08); border:1px dashed rgba(62,230,224,.35); border-radius:8px; padding:6px 10px; display:inline-block; margin-bottom:16px; letter-spacing:.03em; }
  .prompt{ font-size:15px; color:var(--ink-dim); margin-bottom:8px; }
  .formula{ font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--ink); background:var(--bg-0); border:1px solid var(--line); border-radius:12px; padding:22px 20px; text-align:center; margin-bottom:24px; letter-spacing:.02em; line-height:1.4; }

  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .choice{ font-family:var(--font-display); font-weight:700; font-size:20px; padding:20px 10px; border-radius:14px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; transition:transform .12s ease, border-color .15s, background .15s; display:flex; align-items:center; justify-content:center; gap:10px; }
  .choice:hover{transform:translateY(-2px);}
  .choice.true-btn:hover{border-color:var(--true-c);}
  .choice.false-btn:hover{border-color:var(--false-c);}
  .choice:disabled{cursor:default; transform:none;}
  .choice .bit{ font-family:var(--font-mono); font-size:14px; opacity:.6; }
  .choice.correct{ background:rgba(62,230,160,.14); border-color:var(--true-c); color:var(--true-c); }
  .choice.wrong{ background:rgba(255,93,122,.14); border-color:var(--false-c); color:var(--false-c); }

  .feedback{ margin-top:18px; padding:16px 18px; border-radius:12px; border:1px solid var(--line); background:var(--bg-0); font-size:14px; line-height:1.55; color:var(--ink-dim); display:none; }
  .feedback.show{display:block;}
  .feedback b{color:var(--ink);}
  .feedback .verdict{ font-family:var(--font-mono); font-weight:700; letter-spacing:.05em; display:block; margin-bottom:6px; }
  .feedback .verdict.ok{color:var(--true-c);}
  .feedback .verdict.no{color:var(--false-c);}
  .explain-toggle{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.1em;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-top:2px;
  }
  .explain-toggle:hover{ border-color:var(--amber); color:var(--ink); }
  .explain-box{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .explain-box.show{display:block;}

  .next-row{ margin-top:20px; display:flex; justify-content:flex-end; }
  .back-btn{ font-family:var(--font-display); font-weight:700; font-size:15px; background:var(--amber); color:#1a1206; border:none; padding:12px 22px; border-radius:10px; cursor:pointer; display:none; }
  .back-btn.show{display:inline-flex;}
  .back-btn:hover{filter:brightness(1.08);}

  .score-big{ font-size:56px; font-weight:700; margin:6px 0 2px; }
  .score-big span{color:var(--ink-dim); font-size:26px;}

  /* ---------- mystery card (?) ---------- */
  .qcard.mystery{
    border-color:rgba(255,184,51,.45);
    background:
      radial-gradient(circle at 50% 40%, rgba(255,184,51,.14), transparent 65%),
      var(--panel);
    animation:mysteryPulse 2.6s ease-in-out infinite;
  }
  .qcard.mystery:nth-child(3n){ animation-delay:.5s; }
  .qcard.mystery:nth-child(4n){ animation-delay:1.1s; }
  .qcard.mystery:hover{ border-color:var(--amber); transform:translateY(-4px) scale(1.03); box-shadow:0 0 24px rgba(255,184,51,.35); }
  .qcard .q-mark{
    font-size:44px; font-weight:700; color:var(--amber);
    text-shadow:0 0 18px rgba(255,184,51,.55);
    line-height:1;
  }
  .qcard.done{ animation:none; }
  .qcard.done .q-mark, .qcard.done .idx{ display:none; }
  @keyframes mysteryPulse{
    0%,100%{ box-shadow:0 0 0 rgba(255,184,51,0); }
    50%{ box-shadow:0 0 18px rgba(255,184,51,.28); }
  }
  .board-hint{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.08em;
    color:var(--ink-dim); margin-bottom:16px;
  }
  .board-hint b{ color:var(--amber); }

  /* ---------- reveal overlay ---------- */
  .reveal{
    position:fixed; inset:0; z-index:50;
    background:rgba(8,10,20,.88);
    display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:26px;
    padding:24px;
  }
  .reveal.show{ display:flex; }
  .flip-scene{ width:min(300px, 78vw); aspect-ratio:3/4; perspective:1200px; }
  .flip-card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .95s cubic-bezier(.3,.7,.2,1);
  }
  .flip-card.shake{ animation:cardShake .6s ease-in-out; }
  .flip-card.flipped{ transform:rotateY(180deg); }
  @keyframes cardShake{
    0%,100%{ transform:rotate(0) scale(1); }
    15%{ transform:rotate(-4deg) scale(1.03); }
    30%{ transform:rotate(4deg) scale(1.05); }
    45%{ transform:rotate(-3deg) scale(1.05); }
    60%{ transform:rotate(3deg) scale(1.03); }
    80%{ transform:rotate(-1deg) scale(1.02); }
  }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    border:3px solid var(--amber);
  }
  .face.front{
    background:
      radial-gradient(circle at 50% 38%, rgba(255,184,51,.28), transparent 62%),
      var(--bg-1);
    box-shadow:0 0 50px rgba(255,184,51,.35);
  }
  .face.front .big-q{ font-size:130px; font-weight:700; color:var(--amber); text-shadow:0 0 30px rgba(255,184,51,.7); line-height:1; }
  .face.front .card-no{ font-family:var(--font-mono); font-size:13px; letter-spacing:.2em; color:var(--ink-dim); }
  .face.back{
    transform:rotateY(180deg);
    background:var(--bg-1);
    text-align:center;
  }
  .face.back.easy{ border-color:var(--cyan); box-shadow:0 0 50px rgba(62,230,224,.35); }
  .face.back.med{ border-color:var(--amber); box-shadow:0 0 50px rgba(255,184,51,.35); }
  .face.back.hard{ border-color:var(--magenta); box-shadow:0 0 50px rgba(255,107,214,.4); }
  .face.back .prize-lbl{ font-family:var(--font-mono); font-size:12px; letter-spacing:.25em; color:var(--ink-dim); }
  .face.back .prize-pts{ font-size:96px; font-weight:700; line-height:1; }
  .face.back.easy .prize-pts{ color:var(--cyan); }
  .face.back.med .prize-pts{ color:var(--amber); }
  .face.back.hard .prize-pts{ color:var(--magenta); }
  .face.back .prize-unit{ font-size:16px; font-weight:700; letter-spacing:.16em; color:var(--ink); padding:0 10px; }
  .face.back .prize-diff{ font-family:var(--font-mono); font-size:13px; letter-spacing:.18em; color:var(--ink); background:var(--bg-0); border:1px solid var(--line); padding:5px 12px; border-radius:99px; margin-top:6px; }
  .face.back .prize-time{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin-top:2px; }
  .reveal-btn{
    font-family:var(--font-display); font-weight:700; font-size:18px;
    background:linear-gradient(90deg,var(--cyan),var(--amber));
    color:#0c0e1a; border:none; padding:14px 34px; border-radius:12px; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .4s;
  }
  .reveal-btn.show{ opacity:1; pointer-events:auto; }
  .reveal-btn:hover{ filter:brightness(1.06); }

  .src-status{ font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--ink-dim); opacity:.7; margin:16px 0 0; text-align:center; }
  .src-status.warn{ color:var(--amber); }
  .start-btn:disabled{ opacity:.45; cursor:default; filter:none; }
  .face.back .prize-pts.txt{ font-size:44px; line-height:1.15; padding:0 14px; word-break:break-word; }

.start-card{ display:flex; flex-direction:column; align-items:center; gap:28px; padding:36px 32px; max-width:460px; margin:0 auto; }
  .start-left{ text-align:left; }
  .start-title{ font-size:60px; line-height:1; margin:10px 0 16px; letter-spacing:.01em; }
  .start-title span{ color:var(--amber); }
  .start-left .lead{ font-size:18px; max-width:420px; margin:0 0 30px; }
  .qr-plate{ background:#fff; border-radius:22px; padding:18px 18px 12px; width:min(380px,100%); text-align:center; box-shadow:0 18px 50px -16px rgba(0,0,0,.7); }
  .qr-plate img{ display:block; width:100%; height:auto; }
  .qr-cap{ font-family:var(--font-mono); font-weight:700; font-size:12px; letter-spacing:.08em; color:#3a3f55; margin-top:6px; }
  @media (max-width:780px){
    .start-card{ grid-template-columns:1fr; gap:28px; padding:32px 22px; text-align:center; margin-top:40px; }
    .start-left{ text-align:center; }
    .start-title{ font-size:44px; }
    .start-left .lead{ margin:0 auto 24px; font-size:16px; }
    .qr-plate{ width:min(280px,100%); margin:0 auto; }
  }

  .start-solo{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:6px; }
  .start-btn{ font-size:22px; padding:18px 44px; }
.lvl{ display:inline-block; margin-left:10px; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.14em; border:1px solid currentColor; }
  .lvl-easy{ color:var(--cyan); background:rgba(62,230,224,.10); }
  .lvl-med{ color:var(--amber); background:rgba(255,184,51,.10); }
  .lvl-hard{ color:var(--magenta); background:rgba(255,107,214,.10); }
  .lvl-other{ color:var(--ink); background:rgba(233,236,247,.08); }
  .qtag b{ color:var(--ink); }
  .sound-btn{
    position:fixed; top:14px; right:14px; z-index:60;
    width:42px; height:42px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line);
    font-size:18px; cursor:pointer; color:var(--ink);
  }
  .sound-btn:hover{ border-color:var(--amber); }

  @media (max-width:640px){
    .board{ grid-template-columns:repeat(4, 1fr); }
    .qcard .pts{ font-size:20px; }
    .qcard .q-mark{ font-size:34px; }
  }
  @media (max-width:420px){
    .board{ grid-template-columns:repeat(3, 1fr); gap:8px; }
    .formula{font-size:19px;}
    .hud-stats{gap:8px;}
    .stat{min-width:52px;padding:6px 8px;}
  }
</style>
</head>
<body>
<button class="sound-btn" id="sound-btn" onclick="toggleSound()" title="Suara">🔊</button>
<div class="wrap">

  <!-- ============ START SCREEN ============ -->
  <div class="screen show" id="screen-start">
    <div class="start-solo">
      <button class="start-btn" id="btn-start" disabled>MULAI BERMAIN →</button>
      <div class="src-status" id="src-status">Memuat soal...</div>
    </div>
  </div>

  <!-- ============ BOARD SCREEN ============ -->
  <div class="screen" id="screen-board">
    <div class="hud">
      <div class="hud-stats">
        <div class="stat"><div class="num" id="stat-score">0</div><div class="lbl">BENAR</div></div>
        <div class="stat"><div class="num" id="stat-done">0/20</div><div class="lbl">TERJAWAB</div></div>
      </div>
    </div>
    <div class="board-hint">Pilih satu kartu. <b>Isinya misteri</b> — baru ketahuan setelah kartu dibuka!</div>

    <div class="board" id="board"></div>

    <div class="board-footer">
      <button class="finish-btn" id="btn-finish">SELESAIKAN BABAK & LIHAT HASIL</button>
    </div>
  </div>

  <!-- ============ QUESTION SCREEN ============ -->
  <div class="screen" id="screen-question">
    <div class="card">
      <div class="qmeta">
        <div class="qtag" id="qtag">KARTU <b>01</b></div>
        <div class="timer-ring">
          <svg width="46" height="46">
            <circle class="bg" cx="23" cy="23" r="19"></circle>
            <circle class="fg" id="timer-circle" cx="23" cy="23" r="19"></circle>
          </svg>
          <div class="txt" id="timer-txt">20</div>
        </div>
      </div>

      <div class="assign" id="assign-box"></div>

      <div class="prompt" id="qprompt">Tentukan nilai kebenaran dari pernyataan berikut:</div>
      <div class="formula" id="qformula">p ∧ q</div>

      <div class="choices">
        <button class="choice true-btn" id="btn-true" onclick="answer(true)">BENAR <span class="bit">[T]</span></button>
        <button class="choice false-btn" id="btn-false" onclick="answer(false)">SALAH <span class="bit">[F]</span></button>
      </div>

      <div class="feedback" id="feedback">
        <span class="verdict" id="verdict-txt"></span>
        <button class="explain-toggle" id="btn-explain" onclick="toggleExplain()">TAMPILKAN PENJELASAN ⌄</button>
        <div class="explain-box" id="explain-box">
          <span id="explain-txt"></span>
        </div>
      </div>

      <div class="next-row">
        <button class="back-btn" id="btn-back" onclick="backToBoard()">KEMBALI KE PAPAN →</button>
      </div>
    </div>
  </div>

  <!-- ============ END SCREEN ============ -->
  <div class="screen" id="screen-end">
    <div class="card center-txt">
      <span class="rank-badge" id="end-rank">◆ HASIL ◆</span>
      <div class="score-big"><span id="end-score">0</span><span id="end-max">/20 benar</span></div>
      <p class="lead" id="end-msg">Memuat hasil...</p>
      <button class="retry-btn" id="btn-retry" onclick="restart()">MAIN LAGI ↻</button>
    </div>
  </div>

</div>

<!-- ============ REVEAL OVERLAY ============ -->
<div class="reveal" id="reveal">
  <div class="flip-scene">
    <div class="flip-card" id="flip-card">
      <div class="face front">
        <div class="big-q">?</div>
        <div class="card-no" id="reveal-no">KARTU 01</div>
      </div>

// ---------- parser CSV (mendukung tanda kutip, koma, dan baris baru di dalam sel) ----------
function parseCSV(text){
  const rows = []; let row = [], cur = '', inQ = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ','){ row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r'){
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cur); cur = ''; rows.push(row); row = [];
      } else cur += ch;
    }
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function matchLevel(v){
  const t = (v || '').toLowerCase().trim();
  if (/^(dasar|mudah|gampang|easy)/.test(t)) return 'easy';
  if (/^(menengah|sedang|medium|med)/.test(t)) return 'med';
  if (/^(sulit|susah|hard)/.test(t)) return 'hard';
  return null;
}
function parseAnswer(v){
  const t = (v || '').toLowerCase().trim();
  if (/^(benar|true|t|1|ya|yes)$/.test(t)) return true;
  if (/^(salah|false|f|0|tidak|no)$/.test(t)) return false;
  return null;
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// teks aman; **tebal** di Sheet jadi huruf tebal
function fmt(t){ return esc(t || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

function rowsToQuestions(objs){
  const out = [];
  objs.forEach(o => {
    const f = (o.soal || '').trim();
    const ans = parseAnswer(o.jawaban);
    if (!f || ans === null) return;               // baris tidak valid dilewati
    const levelLabel = (o.level || '').trim();      // ditampilkan persis seperti yang diisi di sheet
    const levelCls = matchLevel(o.level) || 'other';
    const diff = matchLevel(o.level) || 'med';       // hanya untuk waktu bawaan
    const pts = parseInt(o.poin, 10);
    const time = parseInt(o.waktu, 10);
    out.push({
      diff, levelLabel, levelCls,
      pts: isNaN(pts) ? 10 : pts,
      prize: (o.hadiah || '').trim(),
      time: (!isNaN(time) && time > 0) ? time : DEFAULT_TIME[diff],
      info: (o.keterangan || '').trim(),
      prompt: (o.petunjuk || '').trim(),
      f, answer: ans,
      explain: fmt(o.penjelasan)
    });
  });
  return out;
}

function csvToObjects(text){
  const table = parseCSV(text);
  if (table.length < 2) return [];
  const head = table[0].map(h => h.trim().toLowerCase());
  return table.slice(1).map(r => {
    const o = {}; head.forEach((h, i) => o[h] = r[i] !== undefined ? r[i] : ''); return o;
  });
}

async function loadQuestions(){
  const param = new URLSearchParams(location.search).get('sheet');
  const url = (param || CONFIG.SHEET_CSV_URL || '').trim();
  let list = [], warn = false;
  if (url){
    try{
      const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      list = rowsToQuestions(csvToObjects(await res.text()));
      if (!list.length) throw new Error('tidak ada baris soal yang valid');
      sourceInfo = `Sumber soal: Google Sheet · ${list.length} soal`;
    } catch(err){
      console.error('Gagal memuat Google Sheet:', err);
      warn = true;
      sourceInfo = 'Google Sheet gagal dimuat — memakai soal bawaan';
    }
  } else {
    sourceInfo = 'Sumber soal: bawaan (Google Sheet belum diatur)';
  }
  if (!list.length) list = rowsToQuestions(DEFAULT_ROWS.map(r => Object.assign({}, r, { penjelasan: r.penjelasan })));
  QUESTIONS = list;
  MAX_SCORE = QUESTIONS.reduce((a, q) => a + q.pts, 0);
  states = QUESTIONS.map(() => null);
  renderIntro();
  const st = document.getElementById('src-status');
  st.textContent = sourceInfo;
  st.classList.toggle('warn', warn);
  document.getElementById('btn-start').disabled = false;
}

let AC = null, muted = false, drone = null;
try { muted = localStorage.getItem('lc_muted') === '1'; } catch(e){}

function ac(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) AC = new C();
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(o){
  const a = ac(); if (!a || muted) return;
  const f = o.f || 440, t = o.t || 0.15, vol = o.vol || 0.15, at = o.at || 0;
  const osc = a.createOscillator(), g = a.createGain();
  const t0 = a.currentTime + at;
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + t);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
  osc.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0 + t + 0.03);
}
function noise(o){
  const a = ac(); if (!a || muted) return;
  const t = o.t || 0.6, vol = o.vol || 0.12, at = o.at || 0;
  const len = Math.floor(a.sampleRate * t);
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(); src.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
  const g = a.createGain();
  const t0 = a.currentTime + at;
  bp.frequency.setValueAtTime(o.from || 300, t0);
  bp.frequency.exponentialRampToValueAtTime(o.to || 3000, t0 + t);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + t * 0.85);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(t0);
}

function startDrone(){
  stopDrone();
  const a = ac(); if (!a || muted) return;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.05, a.currentTime + 1.5);
  const o1 = a.createOscillator(), o2 = a.createOscillator();
  o1.type = 'sawtooth'; o2.type = 'sawtooth';
  o1.frequency.value = 55; o2.frequency.value = 58.3;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
  const lfo = a.createOscillator(), lg = a.createGain();
  lfo.frequency.value = 0.8; lg.gain.value = 0.02;
  lfo.connect(lg); lg.connect(g.gain);
  o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(a.destination);
  o1.start(); o2.start(); lfo.start();
  drone = { g, o1, o2, lfo, lp };
}
function stopDrone(){
  if (!drone || !AC) { drone = null; return; }
  const { g, o1, o2, lfo } = drone;
  try {
    g.gain.cancelScheduledValues(AC.currentTime);
    g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.25);
    [o1, o2, lfo].forEach(o => o.stop(AC.currentTime + 0.3));
  } catch(e){}
  drone = null;
}

function sfxTick(left){

    const up = left <= 10 ? 1 + (10 - left) * 0.05 : 1;

  if (left > 10){

}
// tepuk tangan ramai: ratusan "plok" acak yang disaring
function applause(o){
  const a = ac(); if (!a || muted) return;
  const dur = o.t || 1.6, vol = o.vol || 0.3, at = o.at || 0;
  const sr = a.sampleRate, len = Math.floor(sr * dur);
  const buf = a.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (let k = 0; k < dur * 55; k++){
    const start = Math.floor(Math.random() * (len - 1));
    const clapLen = Math.floor(sr * (0.015 + Math.random() * 0.03));
    const amp = 0.4 + Math.random() * 0.6;
    for (let i = 0; i < clapLen && start + i < len; i++){
      d[start + i] += (Math.random() * 2 - 1) * amp * Math.pow(1 - i / clapLen, 2);
    }
  }
  const src = a.createBufferSource(); src.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.5;
  const g = a.createGain();
  const t0 = a.currentTime + at;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.15);
  g.gain.setValueAtTime(vol, t0 + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(t0);
}

  else {
    ac();
    if (el('screen-question').classList.contains('show') && !answered) startDrone();
  }
}
function updateSoundBtn(){
  const b = document.getElementById('sound-btn');
  if (b) b.textContent = muted ? '🔇' : '🔊';
}

let score = 0;
let states = [];
let currentIdx = null;
let timeLeft = TIME_PER_Q, timerHandle = null, answered = false;

const el = (id) => document.getElementById(id);
const CIRC = 2 * Math.PI * 19;

function showScreen(name){
  ['start','board','question','end'].forEach(s => el('screen-'+s).classList.remove('show'));
  el('screen-'+name).classList.add('show');
}

// Acak posisi soal supaya hadiah di balik tiap kartu tidak bisa ditebak
function shuffleDeck(){
  for (let i = QUESTIONS.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [QUESTIONS[i], QUESTIONS[j]] = [QUESTIONS[j], QUESTIONS[i]];
  }
  states = QUESTIONS.map(() => null);
}

el('btn-start').addEventListener('click', () => {
  ac();
  shuffleDeck();
  showScreen('board');
  renderBoard();
});
el('btn-finish').addEventListener('click', finish);

function renderBoard(){
  const board = el('board');
  board.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const c = document.createElement('div');
    c.className = 'qcard ' + (states[i] !== null ? 'done ' + (states[i] ? 'correct' : 'wrong') : 'mystery');
    c.innerHTML = `
      <span class="idx">#${i+1}</span>
      <span class="q-mark">?</span>
      <span class="mark">${states[i] === true ? '✓' : (states[i] === false ? '✗' : '')}</span>
    `;
    if (states[i] === null){
      c.addEventListener('click', () => revealCard(i));
    }
    board.appendChild(c);
  });
  const doneCount = states.filter(s => s !== null).length;
  el('stat-score').textContent = states.filter(s => s === true).length;
  el('stat-done').textContent = `${doneCount}/${QUESTIONS.length}`;
}

let revealTimers = [];
function revealCard(i){
  const q = QUESTIONS[i];
  const flip = el('flip-card');
  const btn = el('reveal-btn');
  revealTimers.forEach(clearTimeout);
  revealTimers = [];

  // siapkan sisi belakang kartu (hadiah)
  el('reveal-no').textContent = `KARTU ${String(i+1).padStart(2,'0')}`;
  const ptsEl = el('reveal-pts');
  if (q.prize){
    el('reveal-lbl').textContent = 'HADIAHMU';
    ptsEl.textContent = q.prize;
    ptsEl.classList.add('txt');
    el('reveal-unit').textContent = 'JIKA JAWABANMU BENAR!';
  } else {
    el('reveal-lbl').textContent = 'KARTU TERBUKA';
    ptsEl.textContent = '⚡';
    ptsEl.classList.remove('txt');
    el('reveal-unit').textContent = 'SIAP MENJAWAB?';
  }
  el('reveal-back').className = 'face back';

  ac();
  sfxPick();
  flip.className = 'flip-card';
  btn.classList.remove('show');
  el('reveal').classList.add('show');

  // goyang dulu biar tegang, baru dibuka
  void flip.offsetWidth;
  flip.classList.add('shake');
  revealTimers.push(setTimeout(() => {
    flip.classList.remove('shake');
    flip.classList.add('flipped');
    sfxReveal();
  }, 700));
  revealTimers.push(setTimeout(() => btn.classList.add('show'), 1700));

  btn.onclick = () => {
    el('reveal').classList.remove('show');
    openQuestion(i);
  };
}

function openQuestion(i){
  currentIdx = i;
  answered = false;
  const q = QUESTIONS[i];
  el('qtag').innerHTML = `KARTU <b>${String(i+1).padStart(2,'0')}</b>` + (q.levelLabel ? `<span class="lvl lvl-${q.levelCls}">${esc(q.levelLabel)}</span>` : '');
  const ab = el('assign-box');
  ab.textContent = q.info;
  ab.style.display = q.info ? 'inline-block' : 'none';
  el('qprompt').textContent = q.prompt || "Tentukan nilai kebenaran dari pernyataan berikut:";
  el('qformula').textContent = q.f;

  el('feedback').classList.remove('show');
  el('btn-back').classList.remove('show');
  el('explain-box').classList.remove('show');
  el('btn-explain').textContent = 'TAMPILKAN PENJELASAN ⌄';
  ['btn-true','btn-false'].forEach(id => {
    const b = el(id);
    b.disabled = false;
    b.classList.remove('correct','wrong');
  });

  showScreen('question');

  TIME_PER_Q = q.time || 20;
  timeLeft = TIME_PER_Q;
  updateRing();
  startDrone();
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    timeLeft -= 1;
    updateRing();
    if (timeLeft > 0) sfxTick(timeLeft);
    if (timeLeft <= 0){
      clearInterval(timerHandle);
      if (!answered) answer(null); // timeout
    }
  }, 1000);
}

function updateRing(){
  el('timer-txt').textContent = Math.max(timeLeft,0);
  const ratio = Math.max(timeLeft,0) / TIME_PER_Q;
  const offset = CIRC * (1 - ratio);
  const ring = el('timer-circle');
  ring.style.strokeDasharray = CIRC;
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = ratio > 0.3 ? getComputedStyle(document.documentElement).getPropertyValue('--amber') : getComputedStyle(document.documentElement).getPropertyValue('--false-c');
}

function answer(userSaysTrue){
  if (answered) return;
  answered = true;
  clearInterval(timerHandle);
  const q = QUESTIONS[currentIdx];
  const correct = q.answer;
  const isTimeout = userSaysTrue === null;
  const isCorrect = !isTimeout && (userSaysTrue === correct);
  stopDrone();
  if (isTimeout) sfxTimeout(); else if (isCorrect) sfxCorrect(); else sfxWrong();

  el('btn-true').disabled = true;
  el('btn-false').disabled = true;

  const trueBtn = el('btn-true'), falseBtn = el('btn-false');
  if (correct === true){
    trueBtn.classList.add('correct');
    if (userSaysTrue === false) falseBtn.classList.add('wrong');
  } else {
    falseBtn.classList.add('correct');
    if (userSaysTrue === true) trueBtn.classList.add('wrong');
  }
  if (isTimeout){
    (correct ? trueBtn : falseBtn).classList.add('correct');
  }

  states[currentIdx] = isCorrect;
  if (isCorrect) score += q.pts;

  const verdict = el('verdict-txt');
  const explain = el('explain-txt');
  if (isTimeout){
    verdict.textContent = "WAKTU HABIS";
    verdict.className = "verdict no";
  } else if (isCorrect){
    verdict.textContent = q.prize ? `TEPAT! Hadiahmu: ${q.prize}` : "TEPAT!";
    verdict.className = "verdict ok";
  } else {
    verdict.textContent = "MELESET";
    verdict.className = "verdict no";
  }
  explain.innerHTML = q.explain;
  el('feedback').classList.add('show');
  el('btn-back').classList.add('show');
}

function toggleExplain(){
  const box = el('explain-box');
  const btn = el('btn-explain');
  const isShown = box.classList.toggle('show');
  btn.textContent = isShown ? 'SEMBUNYIKAN PENJELASAN ⌃' : 'TAMPILKAN PENJELASAN ⌄';
}

function backToBoard(){
  showScreen('board');
  renderBoard();
  const allDone = states.every(s => s !== null);
  if (allDone) finish();
}

function finish(){
  showScreen('end');
  el('end-score').textContent = states.filter(s => s === true).length;
  let rank, msg;
  el('end-max').textContent = `/${QUESTIONS.length} benar`;
  const pct = MAX_SCORE ? (score / MAX_SCORE) * 100 : 0;
  if (pct >= CONFIG.CHAMPION_PERSEN){
    rank = "◆ GRAND CHAMPION ◆";
    msg = "Presisimu tinggi banget. Kamu jelas sudah menguasai materinya luar-dalam.";
  } else if (pct >= CONFIG.LOLOS_PERSEN){
    rank = "◆ LOLOS BABAK ◆";
    msg = "Solid — dasar-dasarnya sudah kuat. Pelajari lagi bagian yang masih meleset untuk naik level jadi Grand Champion.";
  } else {
    rank = "◆ TERELIMINASI ◆";
    msg = "Belum lolos babak ini. Ulangi materinya lalu coba sekali lagi.";
  }
  el('end-rank').textContent = rank;
  el('end-msg').textContent = msg;
  stopDrone();
  if (pct >= CONFIG.LOLOS_PERSEN) sfxFanfare(); else sfxWrong();
}

function restart(){
  score = 0;
  states = QUESTIONS.map(() => null);
  currentIdx = null;
  showScreen('start');
}

updateSoundBtn();
loadQuestions();
</script>
</body>
</html>
